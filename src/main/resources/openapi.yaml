openapi: 3.0.3
info:
  title: KDB URL Shortener
  description: URL shortening API for Kotlin Brasil.
  version: 1.0.0
servers:
  - url: /
    description: Frontend and Short URLs
  - url: /api/v1
    description: API v1
paths:
  /shorten:
    post:
      summary: Shortens a URL
      operationId: shortenUrl
      tags:
        - API
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/ShortenRequest'
      responses:
        '200':
          description: URL shortened successfully
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ShortenResponse'
        '400':
          description: Validation error or invalid URL
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ErrorResponse'
        '500':
          description: Internal error
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ErrorResponse'
  /{slug}:
    get:
      summary: Redirects to the original URL
      operationId: redirectSlug
      tags:
        - Redirection
      parameters:
        - name: slug
          in: path
          required: true
          schema:
            type: string
      responses:
        '302':
          description: Redirect
        '404':
          description: Slug not found or expired
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ErrorResponse'
  /{slug}/stats:
    get:
      summary: Gets statistics for a link
      operationId: getStats
      tags:
        - API
      parameters:
        - name: slug
          in: path
          required: true
          schema:
            type: string
      responses:
        '200':
          description: Link statistics
          content:
            application/json:
              schema:
                type: object
                properties:
                  slug:
                    type: string
                  clicks:
                    type: integer
        '404':
          description: Link not found
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ErrorResponse'
  /health:
    get:
      summary: Simple health check
      operationId: healthCheck
      tags:
        - Infrastructure
      responses:
        '200':
          description: OK
          content:
            application/json:
              schema:
                type: object
                properties:
                  status:
                    type: string
  /health/ready:
    get:
      summary: Readiness check (checks database)
      operationId: readinessCheck
      tags:
        - Infrastructure
      responses:
        '200':
          description: Ready
        '503':
          description: Not Ready
  /env:
    get:
      summary: Gets the current environment
      operationId: getEnv
      tags:
        - Infrastructure
      responses:
        '200':
          description: OK
  /admin/cleanup:
    post:
      summary: Executes manual cleanup of expired links
      operationId: runCleanup
      tags:
        - Infrastructure
      responses:
        '200':
          description: Success

components:
  schemas:
    ShortenRequest:
      type: object
      required:
        - url
      properties:
        url:
          type: string
          example: https://kotlin.org
        expiresAt:
          type: string
          format: date-time
          description: Expiration date (ISO-8601)
        maxClicks:
          type: integer
          description: Click limit
    ShortenResponse:
      type: object
      properties:
        slug:
          type: string
        shortUrl:
          type: string
    ErrorResponse:
      type: object
      properties:
        code:
          type: string
        message:
          type: string
