<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>URL Shortener</title>
    <style>
        :root {
            --bg-color: #f8f9fa;
            --text-color: #212529;
            --card-bg: #ffffff;
            --border-color: #dee2e6;
            --primary-color: #0d6efd;
            --primary-hover: #0b5ed7;
            --secondary-text: #6c757d;
            --success-color: #198754;
            --danger-color: #dc3545;
            --input-bg: #ffffff;
            --table-stripe: #f2f2f2;
        }

        @media (prefers-color-scheme: dark) {
            :root:not(.light-theme) {
                --bg-color: #212529;
                --text-color: #f8f9fa;
                --card-bg: #343a40;
                --border-color: #495057;
                --primary-color: #375a7f;
                --primary-hover: #2b4764;
                --secondary-text: #adb5bd;
                --success-color: #28a745;
                --danger-color: #e74c3c;
                --input-bg: #2c3034;
                --table-stripe: #2c3034;
            }
        }

        :root.dark-theme {
            --bg-color: #212529;
            --text-color: #f8f9fa;
            --card-bg: #343a40;
            --border-color: #495057;
            --primary-color: #375a7f;
            --primary-hover: #2b4764;
            --secondary-text: #adb5bd;
            --success-color: #28a745;
            --danger-color: #e74c3c;
            --input-bg: #2c3034;
            --table-stripe: #2c3034;
        }

        body {
            font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, Helvetica, Arial, sans-serif, "Apple Color Emoji", "Segoe UI Emoji";
            font-size: 14px;
            background-color: var(--bg-color);
            color: var(--text-color);
            margin: 0;
            padding: 0;
            line-height: 1.5;
            transition: background-color 0.3s, color 0.3s;
        }

        .container {
            max-width: 1200px;
            margin: 0 auto;
            padding: 2rem;
        }

        header {
            margin-bottom: 2rem;
            text-align: center;
            display: flex;
            justify-content: space-between;
            align-items: center;
            flex-wrap: wrap;
        }

        .header-title {
            text-align: left;
            flex: 1;
        }

        h1 {
            font-weight: 700;
            font-size: 2rem;
            margin: 0;
        }

        .theme-switch {
            display: flex;
            align-items: center;
            gap: 0.5rem;
            background: var(--card-bg);
            padding: 0.25rem;
            border-radius: 20px;
            border: 1px solid var(--border-color);
        }

        .theme-btn {
            background: none;
            border: none;
            color: var(--secondary-text);
            padding: 0.4rem;
            border-radius: 50%;
            cursor: pointer;
            display: flex;
            align-items: center;
            justify-content: center;
            transition: all 0.2s;
            width: 32px;
            height: 32px;
        }

        .theme-btn:hover {
            background-color: var(--bg-color);
            color: var(--text-color);
        }

        .theme-btn.active {
            background-color: var(--primary-color);
            color: white;
        }

        .card {
            background-color: var(--card-bg);
            border: 1px solid var(--border-color);
            border-radius: 8px;
            padding: 1.5rem;
            box-shadow: 0 0.125rem 0.25rem rgba(0, 0, 0, 0.075);
            margin-bottom: 2rem;
        }

        .form-row {
            display: flex;
            gap: 1rem;
            flex-wrap: wrap;
            align-items: flex-end;
        }

        .form-group {
            flex: 1;
            min-width: 250px;
            display: flex;
            flex-direction: column;
            gap: 0.5rem;
        }

        .form-group.url {
            flex: 3;
        }

        label {
            font-weight: 500;
            font-size: 0.875rem;
            color: var(--secondary-text);
        }

        input {
            background-color: var(--input-bg);
            color: var(--text-color);
            border: 1px solid var(--border-color);
            border-radius: 4px;
            padding: 0.5rem 0.75rem;
            font-size: 0.9rem;
            outline: none;
            transition: border-color 0.2s;
        }

        input:focus {
            border-color: var(--primary-color);
            box-shadow: 0 0 0 0.2rem rgba(13, 110, 253, 0.25);
        }

        button {
            padding: 0.5rem 1.5rem;
            font-size: 0.9rem;
            font-weight: 600;
            cursor: pointer;
            background-color: var(--primary-color);
            color: white;
            border: none;
            border-radius: 4px;
            transition: background-color 0.2s;
            height: 38px;
            align-self: flex-end;
        }

        button:hover {
            background-color: var(--primary-hover);
        }

        #result {
            margin-top: 1.5rem;
            padding: 1rem;
            background-color: rgba(13, 110, 253, 0.1);
            border: 1px dashed var(--primary-color);
            border-radius: 4px;
            display: none;
            word-break: break-all;
        }

        #result strong {
            display: block;
            margin-bottom: 0.5rem;
            color: var(--primary-color);
        }

        .error-message {
            margin-top: 1rem;
            padding: 0.75rem;
            background-color: rgba(220, 53, 69, 0.1);
            border: 1px solid var(--danger-color);
            border-radius: 4px;
            color: var(--danger-color);
            display: none;
            font-size: 0.875rem;
            font-weight: 500;
        }

        .table-responsive {
            overflow-x: auto;
        }

        table {
            width: 100%;
            border-collapse: collapse;
            font-size: 0.875rem;
        }

        th, td {
            text-align: left;
            padding: 1rem;
            border-bottom: 1px solid var(--border-color);
        }

        th {
            background-color: var(--card-bg);
            font-weight: 600;
            color: var(--secondary-text);
            text-transform: uppercase;
            font-size: 0.75rem;
            letter-spacing: 0.05em;
        }

        tbody tr:nth-child(even) {
            background-color: var(--table-stripe);
        }

        a {
            color: var(--primary-color);
            text-decoration: none;
        }

        a:hover {
            text-decoration: underline;
        }

        .status-active { color: var(--success-color); font-weight: 600; }
        .status-inactive { color: var(--danger-color); font-weight: 600; }

        .pagination {
            display: flex;
            justify-content: center;
            gap: 1rem;
            margin-top: 1.5rem;
            align-items: center;
        }

        .pagination-btn {
            background-color: var(--card-bg);
            color: var(--text-color);
            border: 1px solid var(--border-color);
            padding: 0.5rem 1rem;
            border-radius: 4px;
            cursor: pointer;
            transition: all 0.2s;
            height: auto;
            font-weight: 500;
        }

        .pagination-btn:hover:not(:disabled) {
            background-color: var(--primary-color);
            color: white;
            border-color: var(--primary-color);
        }

        .pagination-btn:disabled {
            opacity: 0.5;
            cursor: not-allowed;
        }

        .pagination-info {
            color: var(--secondary-text);
            font-size: 0.875rem;
        }

        .truncate {
            max-width: 300px;
            white-space: nowrap;
            overflow: hidden;
            text-overflow: ellipsis;
            display: inline-block;
            vertical-align: middle;
        }

        @media (max-width: 768px) {
            .container { padding: 1rem; }
            .form-row { flex-direction: column; align-items: stretch; }
            .form-group { min-width: 100%; }
            button { width: 100%; }
        }
    </style>
</head>
<body>
    <div class="container">
        <header>
            <div class="header-title">
                <h1>URL Shortener</h1>
                <p style="color: var(--secondary-text); margin: 0;">Simple, fast and efficient</p>
            </div>
            <div class="theme-switch">
                <button class="theme-btn" data-theme="light" title="Light Theme">
                    <svg width="18" height="18" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><circle cx="12" cy="12" r="5"></circle><line x1="12" y1="1" x2="12" y2="3"></line><line x1="12" y1="21" x2="12" y2="23"></line><line x1="4.22" y1="4.22" x2="5.64" y2="5.64"></line><line x1="18.36" y1="18.36" x2="19.78" y2="19.78"></line><line x1="1" y1="12" x2="3" y2="12"></line><line x1="21" y1="12" x2="23" y2="12"></line><line x1="4.22" y1="19.78" x2="5.64" y2="18.36"></line><line x1="18.36" y1="5.64" x2="19.78" y2="4.22"></line></svg>
                </button>
                <button class="theme-btn" data-theme="system" title="System Theme">
                    <svg width="18" height="18" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><rect x="2" y="3" width="20" height="14" rx="2" ry="2"></rect><line x1="8" y1="21" x2="16" y2="21"></line><line x1="12" y1="17" x2="12" y2="21"></line></svg>
                </button>
                <button class="theme-btn" data-theme="dark" title="Dark Theme">
                    <svg width="18" height="18" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><path d="M21 12.79A9 9 0 1 1 11.21 3 7 7 0 0 0 21 12.79z"></path></svg>
                </button>
            </div>
        </header>
        
        <div class="card">
            <div class="form-row">
                <div class="form-group url">
                    <label for="urlInput">Destination URL</label>
                    <input type="text" id="urlInput" placeholder="https://example.com/your-long-url">
                </div>
                <div class="form-group">
                    <label for="expiresAtInput">Expires at</label>
                    <input type="datetime-local" id="expiresAtInput">
                </div>
                <div class="form-group" style="flex: 0 0 120px; min-width: 120px;">
                    <label for="maxClicksInput">Max Clicks</label>
                    <input type="number" id="maxClicksInput" min="1" placeholder="Ex: 100">
                </div>
                <button onclick="shortenUrl()">Shorten</button>
            </div>

            <div id="result">
                <strong>✓ Link shortened successfully:</strong> 
                <a id="shortLink" href="#" target="_blank"></a>
            </div>

            <div id="errorMessage" class="error-message"></div>
        </div>

        <div class="card">
            <h2 style="font-size: 1.25rem; margin-top: 0; margin-bottom: 1.5rem;">Existing Links</h2>
            <div class="table-responsive">
                <table>
                    <thead>
                        <tr>
                            <th>Short Link</th>
                            <th>Destination</th>
                            <th>Created at</th>
                            <th>Status</th>
                            <th>Expires at</th>
                            <th>Clicks / Max</th>
                        </tr>
                    </thead>
                    <tbody id="linksTableBody">
                        <!-- Preenchido via JS -->
                    </tbody>
                </table>
            </div>
            <div class="pagination" id="paginationControls">
                <button class="pagination-btn" id="prevBtn" onclick="changePage(-1)">Previous</button>
                <div id="pageNumbers" style="display: flex; gap: 0.5rem;"></div>
                <button class="pagination-btn" id="nextBtn" onclick="changePage(1)">Next</button>
            </div>
        </div>
    </div>

    <script>
        // Theme Management
        const themeBtns = document.querySelectorAll('.theme-btn');
        const htmlElement = document.documentElement;

        function setTheme(theme) {
            htmlElement.classList.remove('light-theme', 'dark-theme');
            themeBtns.forEach(btn => btn.classList.remove('active'));

            if (theme === 'light') {
                htmlElement.classList.add('light-theme');
                document.querySelector('.theme-btn[data-theme="light"]').classList.add('active');
            } else if (theme === 'dark') {
                htmlElement.classList.add('dark-theme');
                document.querySelector('.theme-btn[data-theme="dark"]').classList.add('active');
            } else {
                document.querySelector('.theme-btn[data-theme="system"]').classList.add('active');
            }

            localStorage.setItem('theme-preference', theme);
        }

        themeBtns.forEach(btn => {
            btn.addEventListener('click', () => {
                setTheme(btn.getAttribute('data-theme'));
            });
        });

        // Initialize theme
        const savedTheme = localStorage.getItem('theme-preference') || 'system';
        setTheme(savedTheme);

        let currentPage = 1;
        const pageSize = 25;

        async function shortenUrl() {
            const urlInput = document.getElementById('urlInput');
            const expiresAtInput = document.getElementById('expiresAtInput');
            const maxClicksInput = document.getElementById('maxClicksInput');
            const resultDiv = document.getElementById('result');
            const errorDiv = document.getElementById('errorMessage');
            
            const url = urlInput.value;
            const expiresAt = expiresAtInput.value;
            const maxClicks = maxClicksInput.value;

            resultDiv.style.display = 'none';
            errorDiv.style.display = 'none';

            if (!url) {
                errorDiv.textContent = 'Please enter a URL';
                errorDiv.style.display = 'block';
                return;
            }

            const payload = { url: url };
            if (expiresAt) {
                payload.expiresAt = new Date(expiresAt).toISOString();
            }
            if (maxClicks) {
                payload.maxClicks = parseInt(maxClicks);
            }

            try {
                const response = await fetch('/api/v1/shorten', {
                    method: 'POST',
                    headers: { 'Content-Type': 'application/json' },
                    body: JSON.stringify(payload)
                });

                if (response.ok) {
                    const data = await response.json();
                    const shortLinkA = document.getElementById('shortLink');
                    const shortUrl = window.location.origin + '/' + data.slug;
                    shortLinkA.href = shortUrl;
                    shortLinkA.textContent = shortUrl;
                    resultDiv.style.display = 'block';
                    urlInput.value = '';
                    expiresAtInput.value = '';
                    maxClicksInput.value = '';
                    loadLinks(currentPage);
                } else {
                    const data = await response.json();
                    errorDiv.textContent = 'Error shortening: ' + (data.message || 'Unknown error');
                    errorDiv.style.display = 'block';
                }
            } catch (error) {
                console.error('Error:', error);
                errorDiv.textContent = 'Request error';
                errorDiv.style.display = 'block';
            }
        }

        async function loadLinks(page = 1) {
            try {
                const response = await fetch(`/api/v1/links?page=${page}&size=${pageSize}`);
                if (response.ok) {
                    const data = await response.json();
                    const links = data.items;
                    const total = data.total;
                    const tbody = document.getElementById('linksTableBody');
                    tbody.innerHTML = '';

                    links.forEach(link => {
                        const row = document.createElement('tr');
                        const shortUrl = window.location.origin + '/' + link.slug;
                        
                        row.innerHTML = `
                            <td><a href="${shortUrl}" target="_blank" style="font-family: monospace; font-weight: bold;">${link.slug}</a></td>
                            <td><a href="${link.targetUrl}" target="_blank" class="truncate" title="${link.targetUrl}">${link.targetUrl}</a></td>
                            <td>${new Date(link.createdAt).toLocaleString('en-US', { dateStyle: 'short', timeStyle: 'short' })}</td>
                            <td class="${link.isActive ? 'status-active' : 'status-inactive'}">${link.isActive ? 'Active' : 'Inactive'}</td>
                            <td>${link.expiresAt ? new Date(link.expiresAt).toLocaleString('en-US', { dateStyle: 'short', timeStyle: 'short' }) : '—'}</td>
                            <td>${link.clicksCount} <span style="color: var(--secondary-text)">/ ${link.maxClicks || '∞'}</span></td>
                        `;
                        tbody.appendChild(row);
                    });

                    // Update pagination controls
                    currentPage = data.page;
                    const totalPages = Math.ceil(total / pageSize) || 1;
                    
                    const pageNumbers = document.getElementById('pageNumbers');
                    pageNumbers.innerHTML = '';
                    
                    // Show a few pages around the current page
                    const startPage = Math.max(1, currentPage - 2);
                    const endPage = Math.min(totalPages, currentPage + 2);
                    
                    for (let i = startPage; i <= endPage; i++) {
                        const btn = document.createElement('button');
                        btn.className = `pagination-btn ${i === currentPage ? 'active' : ''}`;
                        btn.textContent = i;
                        btn.onclick = () => loadLinks(i);
                        if (i === currentPage) {
                            btn.disabled = true;
                            btn.style.backgroundColor = 'var(--primary-color)';
                            btn.style.color = 'white';
                        }
                        pageNumbers.appendChild(btn);
                    }

                    const prevBtn = document.getElementById('prevBtn');
                    const nextBtn = document.getElementById('nextBtn');
                    
                    prevBtn.style.visibility = currentPage <= 1 ? 'hidden' : 'visible';
                    nextBtn.style.visibility = currentPage >= totalPages ? 'hidden' : 'visible';
                    
                    if (total <= pageSize) {
                        document.getElementById('paginationControls').style.display = 'none';
                    } else {
                        document.getElementById('paginationControls').style.display = 'flex';
                    }
                }
            } catch (error) {
                console.error('Error loading links:', error);
            }
        }

        function changePage(delta) {
            loadLinks(currentPage + delta);
        }

        loadLinks(currentPage);
    </script>
</body>
</html>
